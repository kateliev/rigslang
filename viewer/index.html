<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rig viewer</title>
<!-- One file, no network requests except: the examples next to it, and the file of `rig.py serve`.
     It mirrors skills/rig/rig.py: the same parser, hashes, checks and compilers (tests/parity.js). -->
<style>
:root{
  --bg:#f7f6f2;--fg:#1d1d1b;--muted:#6b6a65;--faint:#9a988f;--line:#e2dfd6;--card:#fff;--head:#f1efe8;
  --accent:#b8492a;--accent-fg:#fff;--changed:#fff1cc;--changed-line:#e6c25a;--ok:#2f7d4f;--bad:#b3261e;--warn:#9a6a12;
  --hard:#2b5c8a;--hard-bg:#e6eef7;--soft:#8a6212;--soft-bg:#f6eedb;--judge:#7a4f9a;--judge-bg:#f0e8f6;--step:#55534d;--step-bg:#efede6;
  --param:#6a6f2a;--param-bg:#eef0dc;--fail:#a2381f;--fail-bg:#fbe9e4;--pass:#2f6f48;--pass-bg:#e5f2ea;
  --grid:#e9e6dd;--wire-p:#b9b49f;--term:#5b5953;--term-bg:#ecebe6;--hit:#fff8e1;--hit-line:#c4532c;--chip:#efede6;--code:#f3f1ea;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141311;--fg:#ecebe6;--muted:#a3a19a;--faint:#7b7972;--line:#34322d;--card:#211f1c;--head:#26241f;
  --accent:#e2774f;--accent-fg:#1a1a18;--changed:#3a3120;--changed-line:#8a6e2a;--ok:#6cc08f;--bad:#f2817a;--warn:#e0b25a;
  --hard:#8db8e3;--hard-bg:#1f2c3a;--soft:#e3be78;--soft-bg:#33291a;--judge:#c9a2e6;--judge-bg:#2c2236;--step:#c9c6bd;--step-bg:#2a2824;
  --param:#c8cc8a;--param-bg:#2a2c1d;--fail:#f0a08a;--fail-bg:#3a231d;--pass:#8fd0a8;--pass-bg:#1d3326;
  --grid:#1f1d1a;--wire-p:#57544b;--term:#c9c6bd;--term-bg:#2a2824;--hit:#33291c;--hit-line:#e2774f;--chip:#2c2a26;--code:#1a1917;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141311;--fg:#ecebe6;--muted:#a3a19a;--faint:#7b7972;--line:#34322d;--card:#211f1c;--head:#26241f;
  --accent:#e2774f;--accent-fg:#1a1a18;--changed:#3a3120;--changed-line:#8a6e2a;--ok:#6cc08f;--bad:#f2817a;--warn:#e0b25a;
  --hard:#8db8e3;--hard-bg:#1f2c3a;--soft:#e3be78;--soft-bg:#33291a;--judge:#c9a2e6;--judge-bg:#2c2236;--step:#c9c6bd;--step-bg:#2a2824;
  --param:#c8cc8a;--param-bg:#2a2c1d;--fail:#f0a08a;--fail-bg:#3a231d;--pass:#8fd0a8;--pass-bg:#1d3326;
  --grid:#1f1d1a;--wire-p:#57544b;--term:#c9c6bd;--term-bg:#2a2824;--hit:#33291c;--hit-line:#e2774f;--chip:#2c2a26;--code:#1a1917;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
code,pre,.mono{font-family:var(--mono);font-size:12.5px}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
button{cursor:pointer}button:hover{border-color:var(--faint)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
button:disabled{opacity:.45;cursor:default}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);margin:0}
input.invalid{border-color:var(--bad);background:var(--fail-bg)}
a{color:inherit}

/* Header */
header{flex:none;border-bottom:1px solid var(--line);background:var(--bg);z-index:5}
.bar{padding:8px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em}
.tabs{display:flex;gap:2px;background:var(--head);border:1px solid var(--line);border-radius:8px;padding:2px}
.tabs button{border:0;background:none;padding:2px 12px;border-radius:6px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.pill{border:1px solid var(--line);border-radius:999px;padding:1px 10px;color:var(--muted);font-size:12px;white-space:nowrap}
.pill b{color:var(--fg);font-weight:600}
.spacer{flex:1}
#fname{color:var(--muted);max-width:28ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
#dirty{color:var(--warn);font-size:13px}
#msg{font-size:12px}#msg.ok{color:var(--ok)}#msg.bad{color:var(--bad)}
.bar label{display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-size:12px}
.sub{border-top:1px solid var(--line);padding:6px 16px}

/* Pages */
#page{flex:1;overflow:auto;min-height:0}
main{max-width:1440px;margin:0 auto;padding:14px 16px 64px}
.empty{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted);max-width:900px;margin:24px auto}
.empty textarea{width:100%;min-height:160px;margin-top:12px;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px;font:12.5px var(--mono)}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;align-items:center}
body.drag #page{outline:3px dashed var(--accent);outline-offset:-8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
.card h2{font-size:17px;margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.scope{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.st{font-size:12px;padding:0 8px;border-radius:99px;background:var(--chip);color:var(--muted)}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.err{color:var(--bad)}
.lead{margin:8px 0 0}
.lead b{display:inline-block;width:72px;color:var(--faint);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 6px;font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:10px}
th{background:var(--head);text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child{border-top-left-radius:10px}th:last-child{border-top-right-radius:10px}
td{border-top:1px solid var(--line);padding:8px 10px;vertical-align:top;font-size:13px}
tr:nth-child(2) td,tbody tr:first-child td{border-top:0}
td.mono{white-space:pre-wrap}
tr.changed td{background:var(--changed)}
tr.hl td{background:var(--hit)}
tr.flash td{animation:flash 1.6s ease-out}
@keyframes flash{0%,20%{background:var(--hit)}100%{background:transparent}}
.dim{color:var(--muted)}.faint{color:var(--faint)}
.diag{margin:0;padding-left:18px;font-size:13px}.diag li.err{color:var(--bad)}.diag li.warn{color:var(--warn)}
pre.cast,pre.out{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:6px 0 0;white-space:pre}
pre.out{white-space:pre-wrap;font-size:12.5px;line-height:1.5}
details summary{cursor:pointer}
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--muted)}
.tool input[type=text]{width:220px}

/* Badges, chips, links */
.gid{display:inline-block;font:600 11px/1.6 var(--mono);padding:0 6px;border-radius:4px;color:var(--step);background:var(--step-bg)}
.gid.hard{color:var(--hard);background:var(--hard-bg)}.gid.soft{color:var(--soft);background:var(--soft-bg)}
.gid.judge{color:var(--judge);background:var(--judge-bg)}.gid.end{color:var(--term);background:var(--term-bg)}
.kind{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint)}
.chip{display:inline-flex;align-items:baseline;gap:4px;padding:0 6px;border-radius:5px;background:var(--chip);border:1px solid transparent;cursor:pointer;white-space:nowrap;font-size:12px;line-height:1.6}
.chip .rid{font:11px var(--mono);color:var(--muted)}
.chip b{font-weight:600}
.chip.changed{background:var(--changed);border-color:var(--changed-line)}
.chip:hover{border-color:var(--faint)}
.flowstrip{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:4px 0 10px}
.flowstrip a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-size:12px;padding:2px 8px 2px 4px;border-radius:6px;border:1px solid var(--line);background:var(--card)}
.flowstrip a:hover{border-color:var(--hit-line)}
.flowstrip .arrow{color:var(--faint);font-size:11px}
.links{display:flex;flex-direction:column;gap:4px}
.lk{display:flex;gap:6px;align-items:baseline;font-size:12px}
.lk .sym{font-weight:700;width:12px;flex:none;text-align:center}
.lk.pass .sym{color:var(--pass)}.lk.fail .sym{color:var(--fail)}.lk.from .sym{color:var(--faint)}
.lk a{text-decoration:none;cursor:pointer}
.lk .when{color:var(--muted)}
.code{font:11.5px var(--mono);color:var(--muted);word-break:break-word}
.eds{display:flex;flex-direction:column;gap:6px}
.ed{display:flex;flex-direction:column;gap:2px}
.ed .lab{font-size:12px;line-height:1.3}
.ed .lab .rid{display:block;font:11px var(--mono);color:var(--faint)}
.ed.changed{background:var(--changed);border-radius:6px;padding:3px 5px;margin:-3px -5px}
.unitx{font-size:11px;color:var(--muted)}
input.num{width:84px}input.txt{width:160px;font-family:var(--mono);font-size:12px}
.none{color:var(--faint);font-size:12px;font-style:italic}

/* Graph */
#graph{flex:1;display:none;min-height:0}
body.tab-graph #graph{display:flex}
body.tab-graph #page{display:none}
#view{flex:1;position:relative;overflow:hidden;cursor:grab;touch-action:none;background-color:var(--bg);background-image:radial-gradient(var(--grid) 1.2px,transparent 1.2px)}
#view.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg#wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.w{fill:none;stroke-width:2;transition:opacity .15s,stroke-width .15s}
.w.pass{stroke:var(--pass)}
.w.fail{stroke:var(--fail);stroke-dasharray:6 5}
.w.param{stroke:var(--wire-p);stroke-width:1.4}
.w.back{stroke-dasharray:2 5;stroke-linecap:round}
body.anim .w.pass:not(.back){stroke-dasharray:10 8;animation:flow 1.1s linear infinite}
body.anim .w.pass.back{animation:flow .9s linear infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
body.focus .w{opacity:.08}
body.focus .w.on{opacity:1;stroke-width:3}
body.focus .w.param.on{stroke:var(--accent);stroke-width:2}
body.no-param .w.param{display:none}
body.no-fail .w.fail{display:none}
.wl{font:600 10px var(--mono);fill:var(--muted);paint-order:stroke;stroke:var(--bg);stroke-width:4px;opacity:0}
body.focus .wl.on{opacity:1}
.node{position:absolute;width:260px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);user-select:none;transition:opacity .15s;font-size:13px}
body.focus .node{opacity:.35}
body.focus .node.on{opacity:1}
.node.sel{outline:2px solid var(--accent);outline-offset:2px}
.node .hd{display:flex;gap:7px;align-items:center;padding:6px 10px;border-radius:9px 9px 0 0;cursor:move;position:relative;background:var(--step-bg)}
.node.hard .hd{background:var(--hard-bg)}.node.soft .hd{background:var(--soft-bg)}.node.judge .hd{background:var(--judge-bg)}
.node.judge{border-style:dashed}
.node.params .hd{background:var(--param-bg)}
.node .hd .t{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .hd .gid{background:var(--card)}
.node .by{font:11px/1.35 var(--mono);color:var(--muted);padding:5px 10px 0;word-break:break-word}
.node .txt{font-size:12px;line-height:1.35;color:var(--fg);padding:4px 10px 2px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.node .sec{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);padding:6px 10px 1px}
.row{position:relative;display:flex;gap:6px;align-items:center;padding:2px 10px;min-height:22px;font-size:12px}
.row .rid{font:11px var(--mono);color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{font:600 11px var(--mono);white-space:nowrap;max-width:100px;overflow:hidden;text-overflow:ellipsis}
.row.changed{background:var(--changed)}
.row.out{justify-content:flex-end;text-align:right}
.row.out .when{color:var(--muted);font-size:11.5px;line-height:1.25;padding:2px 0}
.row.out.pass .sym{color:var(--pass);font-weight:700}
.row.out.fail .sym{color:var(--fail);font-weight:700}
.node .foot{height:6px}
.node.changed{box-shadow:var(--shadow),inset 3px 0 0 var(--changed-line)}
.port{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid var(--card);top:50%;margin-top:-6px;box-shadow:0 0 0 1px var(--line)}
.port.in{left:-7px}.port.out{right:-7px}
.port.flow{background:var(--pass);width:14px;height:14px;margin-top:-7px;border-radius:4px}
.port.f-fail{background:var(--fail)}
.port.p-in{background:var(--wire-p);width:10px;height:10px;margin-top:-5px}
.port.p-out{background:var(--param);width:10px;height:10px;margin-top:-5px}
.params .row{padding:3px 10px}
.params .lab{flex:1;min-width:0;line-height:1.2}
.params .lab .l{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.params .lab .rid{display:block;font-size:10px}
.params .ctl{flex:none;display:flex;gap:3px;align-items:center}
.params input.num{width:64px;padding:1px 4px;font-size:12px}
.params input.txt{width:96px;padding:1px 4px;font-size:11px}
.params select{padding:1px 2px;font-size:12px;max-width:100px}
.params .unused .lab .l{color:var(--faint)}
.node.params{width:300px}
.node.term{width:auto;min-width:150px;max-width:230px;background:var(--term-bg);border-style:dashed}
.node.term .hd{background:none;font-weight:600;color:var(--term);padding:7px 12px 7px 14px}
.node.term .hd .t{white-space:normal}
.node.term .n{font:11px var(--mono);color:var(--faint);font-weight:400}
aside{flex:none;width:350px;border-left:1px solid var(--line);background:var(--card);overflow:auto;padding:14px 16px 40px;font-size:13px}
aside h2{font-size:15px;margin:6px 0 2px}
aside .k{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:12px 0 3px}
aside p{margin:0}
.hint{color:var(--muted);font-size:12px}
.hint kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:0 4px;background:var(--bg)}
.legend{display:grid;grid-template-columns:28px 1fr;gap:5px 8px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}
.legend svg{display:block}
@media (max-width:820px){aside{display:none}}
@media (max-width:980px){#fname{display:none}}
</style>
</head>
<body class="anim">
<header>
  <div class="bar">
    <span class="brand">Rig</span>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="units">Units</button>
      <button role="tab" data-tab="graph">Graph</button>
      <button role="tab" data-tab="skill">Skill</button>
      <button role="tab" data-tab="json">JSON</button>
    </div>
    <select id="unit" aria-label="Unit" hidden></select>
    <span id="fname"></span><span id="dirty"></span>
    <span class="spacer"></span>
    <span id="msg" role="status"></span>
    <select id="preset" aria-label="Apply a preset" hidden><option value="">preset…</option></select>
    <button id="open">Open…</button>
    <button id="save" class="primary" disabled>Save</button>
    <button id="close" disabled>Close</button>
    <input type="file" id="file" accept=".rig,text/plain" hidden>
  </div>
  <div class="bar sub" id="gbar" hidden>
    <span class="pill" id="cov"></span>
    <span class="spacer"></span>
    <label><input type="checkbox" id="t-param" checked> rule wires</label>
    <label><input type="checkbox" id="t-fail" checked> fail paths</label>
    <label><input type="checkbox" id="t-anim" checked> flow</label>
    <button id="fit" title="Fit the graph (F)">Fit</button>
    <button id="relayout" title="Forget dragged positions">Auto layout</button>
  </div>
</header>
<div id="page"></div>
<div id="graph">
  <div id="view" tabindex="0" aria-label="Flow graph"><div id="world"><svg id="wires"></svg></div></div>
  <aside id="insp"></aside>
</div>

<script>
"use strict";
// - DOM helpers --------------------------------------
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const store = {
  get(k) { try { return localStorage.getItem("rig." + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem("rig." + k, v); } catch (e) { /* private mode */ } },
};
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

// - SHA-256 (no secure context needed) -----------------
const SHA = (() => {
  const K = [], H = [], frac = x => ((x - Math.floor(x)) * 4294967296) >>> 0;
  for (let n = 2, c = 0; c < 64; n++) {
    let p = true;
    for (let d = 2; d * d <= n; d++) if (n % d === 0) { p = false; break; }
    if (!p) continue;
    if (c < 8) H.push(frac(Math.sqrt(n)));
    K.push(frac(Math.cbrt(n)));
    c++;
  }
  return { K, H };
})();
function sha256hex(str) {
  const msg = new TextEncoder().encode(str), len = msg.length;
  const total = ((len + 9 + 63) >> 6) << 6, buf = new Uint8Array(total);
  buf.set(msg); buf[len] = 0x80;
  const dv = new DataView(buf.buffer);
  dv.setUint32(total - 8, Math.floor(len / 536870912)); dv.setUint32(total - 4, (len * 8) >>> 0);
  const h = SHA.H.slice(), w = new Uint32Array(64), r = (x, n) => (x >>> n) | (x << (32 - n));
  for (let off = 0; off < total; off += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(off + i * 4);
    for (let i = 16; i < 64; i++) {
      const a = w[i - 15], b = w[i - 2];
      w[i] = (w[i - 16] + (r(a, 7) ^ r(a, 18) ^ (a >>> 3)) + w[i - 7] + (r(b, 17) ^ r(b, 19) ^ (b >>> 10))) >>> 0;
    }
    let [A, B, C, D, E, F, G, X] = h;
    for (let i = 0; i < 64; i++) {
      const t1 = (X + (r(E, 6) ^ r(E, 11) ^ r(E, 25)) + ((E & F) ^ (~E & G)) + SHA.K[i] + w[i]) >>> 0;
      const t2 = ((r(A, 2) ^ r(A, 13) ^ r(A, 22)) + ((A & B) ^ (A & C) ^ (B & C))) >>> 0;
      X = G; G = F; F = E; E = (D + t1) >>> 0; D = C; C = B; B = A; A = (t1 + t2) >>> 0;
    }
    [A, B, C, D, E, F, G, X].forEach((v, i) => { h[i] = (h[i] + v) >>> 0; });
  }
  return h.map(x => x.toString(16).padStart(8, "0")).join("");
}
const h8 = s => "#" + sha256hex(s).slice(0, 8);

// - Parser (same rules as rig.py) ----------------------
